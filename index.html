<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#100d22">
    <meta name="color-scheme" content="dark">
    <title>Someone interesting could be closer than you think</title>

    <style>
        :root {
            --bg: #0b0915;
            --panel: rgba(29, 24, 52, .72);
            --text: #fffaff;
            --muted: #b9b2cc;
            --accent: #ff4d8d;
            --accent-2: #8b5cf6;
            --ring: rgba(255, 77, 141, .28);
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100svh;
            overflow-x: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 12%, rgba(139, 92, 246, .30), transparent 34rem),
                radial-gradient(circle at 88% 82%, rgba(255, 77, 141, .22), transparent 30rem),
                var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: grid;
            place-items: center;
            padding: max(22px, env(safe-area-inset-top)) 20px max(22px, env(safe-area-inset-bottom));
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .28;
            background-image: radial-gradient(rgba(255,255,255,.32) .7px, transparent .7px);
            background-size: 18px 18px;
            -webkit-mask-image: linear-gradient(to bottom, black, transparent 72%);
            mask-image: linear-gradient(to bottom, black, transparent 72%);
        }

        .card {
            position: relative;
            width: min(100%, 440px);
            padding: 30px 26px 24px;
            overflow: hidden;
            text-align: center;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 30px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.08);
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            padding: 8px 12px;
            color: #ded8ed;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #62e6a7;
            box-shadow: 0 0 0 5px rgba(98,230,167,.1);
        }

        .animation {
            position: relative;
            display: grid;
            place-items: center;
            width: 158px;
            height: 158px;
            margin: 0 auto 24px;
        }

        .orbit, .orbit::before, .orbit::after {
            position: absolute;
            inset: 0;
            content: "";
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.10);
        }

        .orbit {
            animation: breathe 2.6s ease-in-out infinite;
            background: radial-gradient(circle, rgba(255,77,141,.18), rgba(139,92,246,.08) 54%, transparent 55%);
        }

        .orbit::before { inset: 14px; border-color: rgba(255,77,141,.22); }
        .orbit::after { inset: 29px; border-color: rgba(139,92,246,.30); }

        .spark {
            position: absolute;
            top: 2px;
            left: 74px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff8bb5;
            box-shadow: 0 0 18px 5px rgba(255,77,141,.42);
            transform-origin: 5px 77px;
            animation: rotate 3.4s linear infinite;
        }

        .heart-icon {
            position: relative;
            z-index: 1;
            width: 70px;
            height: 70px;
            display: grid;
            place-items: center;
            border-radius: 23px;
            background: linear-gradient(145deg, var(--accent), var(--accent-2));
            box-shadow: 0 14px 34px rgba(255,77,141,.25);
            animation: float 2.2s ease-in-out infinite;
        }

        .heart-icon svg {
            width: 34px;
            height: 34px;
            fill: rgba(255,255,255,.18);
        }

        h1 {
            max-width: 360px;
            margin: 0 auto 12px;
            font-size: clamp(28px, 8vw, 38px);
            line-height: 1.08;
            letter-spacing: -.045em;
        }

        .subtitle {
            max-width: 330px;
            min-height: 48px;
            margin: 0 auto 25px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
        }

        .continue-button {
            position: relative;
            width: 100%;
            min-height: 58px;
            border: 0;
            border-radius: 18px;
            color: white;
            background: linear-gradient(105deg, var(--accent), #dc3eff 56%, var(--accent-2));
            background-size: 180% 100%;
            box-shadow: 0 14px 34px rgba(194,55,214,.27), 0 0 0 0 var(--ring);
            font: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
            animation: glow 2.3s ease-in-out infinite, gradient 5s ease infinite;
            -webkit-tap-highlight-color: transparent;
        }

        .continue-button:hover { transform: translateY(-2px); filter: brightness(1.06); }
        .continue-button:active { transform: scale(.985); }
        .continue-button:focus-visible { outline: 3px solid rgba(255,255,255,.85); outline-offset: 4px; }
        .continue-button[disabled] { cursor: wait; filter: saturate(.5); }

        .fallback {
            display: none;
            margin-top: 17px;
            padding-top: 17px;
            border-top: 1px solid rgba(255,255,255,.08);
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .fallback.visible { display: block; animation: fade-in .25s ease both; }

        .copy-button {
            margin-top: 10px;
            padding: 9px 13px;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 11px;
            color: white;
            background: rgba(255,255,255,.07);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        @keyframes rotate { to { transform: rotate(360deg); } }
        @keyframes breathe { 50% { transform: scale(1.055); opacity: .8; } }
        @keyframes float { 50% { transform: translateY(-7px) rotate(2deg); } }
        @keyframes glow { 50% { box-shadow: 0 16px 40px rgba(194,55,214,.34), 0 0 0 9px transparent; } }
        @keyframes gradient { 50% { background-position: 100% 0; } }
        @keyframes fade-in { from { opacity: 0; transform: translateY(-5px); } }

        @media (max-height: 650px) {
            .card { padding-top: 22px; }
            .badge { margin-bottom: 13px; }
            .animation { width: 126px; height: 126px; margin-bottom: 15px; }
            .spark { left: 58px; transform-origin: 5px 61px; }
            .heart-icon { width: 62px; height: 62px; }
            .subtitle { margin-bottom: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    <main class="card" aria-labelledby="title">
        <div class="badge"><span class="badge-dot"></span><span data-i18n="badge">New connections</span></div>

        <div class="animation" aria-hidden="true">
            <div class="orbit"></div>
            <div class="spark"></div>
            <div class="heart-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/>
                </svg>
            </div>
        </div>

        <h1 id="title" data-i18n="title">Someone interesting could be closer than you think</h1>
        <p class="subtitle" data-i18n="subtitle">Browse profiles and see who could start your next conversation.</p>

        <button class="continue-button" id="continueButton" type="button" data-i18n="button">
            Browse profiles
        </button>

        <div class="fallback" id="fallback" aria-live="polite">
            <span data-i18n="fallback">Didn't open? Copy the link and paste it into your browser.</span><br>
            <button class="copy-button" id="copyButton" type="button" data-i18n="copy">Copy link</button>
        </div>
    </main>

    <script>
        (() => {
            'use strict';

            const DESTINATION_URL = 'https://zobzal.dreeamdate.com/?utm_source=da57dc555e50572d&ban=inst&j1=1&s1=175970&s2=2282528';

            const translations = {
                en: {
                    badge: 'New connections',
                    title: 'Are you ready for the girls from this site to write first?',
                    subtitle: 'Found 26 online girls profiles within 0.2 miles of you',
                    button: 'Browse profiles',
                    opening: 'Opening…',
                    fallback: "Didn't open? Copy the link and paste it into your browser.",
                    copy: 'Copy link',
                    copied: 'Copied!'
                },
                ru: {
                    badge: 'Новые знакомства',
                    title: 'Кто-то интересный может быть совсем рядом',
                    subtitle: 'Откройте анкеты и узнайте, с кем может начаться ваш следующий разговор.',
                    button: 'Посмотреть анкеты',
                    opening: 'Открываем…',
                    fallback: 'Не открылось? Скопируйте ссылку и вставьте её в браузер.',
                    copy: 'Скопировать ссылку',
                    copied: 'Скопировано!'
                }
            };

            const language = (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
            const text = translations[language];
            document.documentElement.lang = language;

            document.querySelectorAll('[data-i18n]').forEach((element) => {
                element.textContent = text[element.dataset.i18n];
            });

            const continueButton = document.getElementById('continueButton');
            const copyButton = document.getElementById('copyButton');
            const fallback = document.getElementById('fallback');
            const isAndroid = /Android/i.test(navigator.userAgent);
            let redirectStarted = false;
            let autoRedirectTimer;

            function openDestination(userInitiated) {
                if (redirectStarted) return;
                redirectStarted = true;
                window.clearTimeout(autoRedirectTimer);
                continueButton.disabled = true;
                continueButton.textContent = text.opening;

                if (userInitiated && isAndroid) {
                    const url = new URL(DESTINATION_URL);
                    const intentUrl = `intent://${url.host}${url.pathname}${url.search}#Intent;scheme=${url.protocol.slice(0, -1)};action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(DESTINATION_URL)};end`;
                    window.location.assign(intentUrl);
                } else {
                    window.location.assign(DESTINATION_URL);
                }

                window.setTimeout(() => {
                    redirectStarted = false;
                    continueButton.disabled = false;
                    continueButton.textContent = text.button;
                    fallback.classList.add('visible');
                }, 1400);
            }

            async function copyDestination() {
                try {
                    await navigator.clipboard.writeText(DESTINATION_URL);
                } catch (_) {
                    const input = document.createElement('textarea');
                    input.value = DESTINATION_URL;
                    input.style.position = 'fixed';
                    input.style.opacity = '0';
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    input.remove();
                }

                copyButton.textContent = text.copied;
                window.setTimeout(() => { copyButton.textContent = text.copy; }, 1800);
            }

            continueButton.addEventListener('click', () => openDestination(true));
            copyButton.addEventListener('click', copyDestination);
            autoRedirectTimer = window.setTimeout(() => openDestination(false), 15000);
        })();
    </script>
</body>
</html>
